<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca Central — Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="pagina-login">
    <section class="intro-login">
      <span class="selo">Sistema de empréstimos</span>
      <h1>Biblioteca<br>Central</h1>
      <p>Gerencie o acervo, acompanhe empréstimos e devoluções em um só lugar — para bibliotecários e leitores.</p>
      <div class="lombadas" aria-hidden="true">
        <div class="lombada" style="background:#7A2E2E"></div>
        <div class="lombada" style="background:#2F5233"></div>
        <div class="lombada" style="background:#8a5a12"></div>
        <div class="lombada" style="background:#4a5568"></div>
        <div class="lombada" style="background:#5e2222"></div>
      </div>
    </section>

    <section class="cartao">
      <div class="abas">
        <button type="button" class="aba-botao ativa" data-aba="login">Entrar</button>
        <button type="button" class="aba-botao" data-aba="registro">Criar conta</button>
      </div>

      <div class="mensagem" id="mensagem"></div>

      <!-- Formulário de login -->
      <form class="formulario ativo" id="form-login" data-form="login">
        <label>
          Email
          <input type="email" id="login-email" required autocomplete="email" />
        </label>
        <label>
          Senha
          <input type="password" id="login-senha" required autocomplete="current-password" />
        </label>
        <button type="submit" class="botao botao-primario">Entrar</button>
      </form>

      <!-- Formulário de registro -->
      <form class="formulario" id="form-registro" data-form="registro">
        <label>
          Nome
          <input type="text" id="registro-nome" required autocomplete="name" />
        </label>
        <label>
          Email
          <input type="email" id="registro-email" required autocomplete="email" />
        </label>
        <label>
          Senha
          <input type="password" id="registro-senha" required minlength="6" autocomplete="new-password" />
        </label>
        <label>
          Perfil
          <div class="perfil-escolha">
            <label class="perfil-opcao">
              <input type="radio" name="perfil" value="leitor" checked />
              Leitor
            </label>
            <label class="perfil-opcao">
              <input type="radio" name="perfil" value="bibliotecario" />
              Bibliotecário
            </label>
          </div>
        </label>
        <button type="submit" class="botao botao-primario">Criar conta</button>
      </form>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
